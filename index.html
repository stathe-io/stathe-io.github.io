<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stathe</title>
<meta name="description" content="Read-only Kubernetes assessment. Nothing installed, nothing hidden.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Palette from stathe/docs/brand. The wordmark is Archivo Black outlined to
     paths (wordmark.svg), matched to docs/banner.png; text is IBM Plex Sans,
     as in the banner. Both fonts are OFL and served from here, not Google. */
  @font-face {
    font-family: "IBM Plex Sans";
    src: url(fonts/ibm-plex-sans.woff2) format("woff2");
    font-weight: 100 700;
    font-display: swap;
  }
  :root {
    --ink: #0a1420;
    --glow: #0b2a32;
    --word: #e8eef4;
    --accent: #19c7b2;
    --muted: #8ba3ad;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(70% 60% at 50% 25%, var(--glow) 0%, rgba(11,42,50,0) 70%),
      var(--ink);
    color: var(--word);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; min-width: 0; max-width: 100%; text-align: center; }
  h1 img { display: block; width: min(560px, 82vw); height: auto; }
  .line { font-size: clamp(16px, 2.4vw, 20px); color: var(--muted); }
  nav { display: flex; gap: 28px; margin-top: 8px; }
  nav a {
    color: var(--word); font-size: 15px; font-weight: 600; text-decoration: none;
    padding-bottom: 3px; border-bottom: 2px solid var(--accent);
  }
  nav a:hover, nav a:focus-visible { color: var(--accent); outline: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="wordmark.svg" alt="stathe" width="3381" height="737"></h1>
  <p class="line">Read-only Kubernetes assessment. Nothing installed, nothing hidden.</p>
  <nav>
    <a href="https://github.com/stathe-io/stathe">GitHub</a>
    <a href="https://www.linkedin.com/in/jarnokristelijn">LinkedIn</a>
  </nav>
</div>
</body>
</html>
